<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>250th Founding Records Calendar - Town of Kennard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Roboto:wght@300;400&display=swap');
        :root {
            --flag-blue:#0a3161;
            --flag-blue-dark:#061b38;
            --flag-blue-mid:#123f77;
            --flag-red:#b31942;
            --flag-red-bright:#e5233f;
            --white:#ffffff;
            --soft-white:#f5f8ff;
            --line-blue:#6f93c2;
        }
        body { margin:0; font-family:'Roboto',sans-serif; background:#eef4ff; color:var(--flag-blue-dark); }
        .blue-header { background-color:#001f3f; }
        .top-brand { padding:6px 0; }
        .usa250-page { padding:24px 0 0; }
        .calendar-shell { display:flex; width:min(1320px, calc(100% - 32px)); min-height:720px; margin:0 auto; border-radius:8px; overflow:hidden; box-shadow:0 8px 28px rgba(0,31,63,0.18); }
        .calendar-panel { width:33%; background:linear-gradient(180deg,var(--flag-blue),var(--flag-blue-dark)); padding:20px; border-right:4px solid var(--flag-red); overflow-y:auto; }
        .calendar-panel h1 { font-family:'Libre Baskerville',serif; text-align:center; color:var(--white); border-bottom:2px solid var(--flag-red); padding-bottom:10px; text-shadow:0 2px 10px rgba(0,0,0,0.35); }
        .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:15px; }
        .day-header { text-align:center; font-weight:bold; color:var(--white); padding:8px 0; border-bottom:2px solid rgba(255,255,255,0.28); }
        .day { background:#f8fbff; color:var(--flag-blue-dark); height:60px; display:flex; align-items:flex-start; justify-content:center; cursor:pointer; border-radius:4px; border:1px solid rgba(10,49,97,0.28); transition:all .2s; font-size:0.9em; position:relative; padding-top:10px; box-sizing:border-box; }
        .day:hover { background:var(--flag-red); color:var(--white); border-color:var(--white); }
        .day.today { background:var(--flag-red-bright); color:var(--white); font-weight:bold; box-shadow:0 0 0 2px var(--white),0 0 18px rgba(229,35,63,0.55); }
        .day.has-event { background:var(--flag-blue-mid); color:var(--white); font-weight:bold; box-shadow:inset 0 -4px 0 var(--flag-red); }
        .archive-dots { position:absolute; left:5px; right:5px; bottom:6px; display:flex; justify-content:center; gap:3px; flex-wrap:wrap; }
        .archive-dot { width:7px; height:7px; border-radius:50%; border:1px solid rgba(255,255,255,0.85); box-sizing:border-box; }
        .day.other-month { opacity:0.4; }
        .events-panel { width:67%; padding:30px; overflow-y:auto; background:linear-gradient(180deg,#ffffff 0%,#eef4ff 55%,#dfeaff 100%); color:var(--flag-blue-dark); }
        .search-box { width:100%; padding:12px; margin-bottom:15px; background:var(--white); border:2px solid var(--flag-blue); color:var(--flag-blue-dark); font-size:1em; box-sizing:border-box; }
        .search-box::placeholder { color:#557399; }
        .date-header { color:var(--flag-red); font-family:'Libre Baskerville',serif; font-size:1.45em; font-weight:700; margin:8px 0 18px; }
        .event { margin-bottom:18px; padding:15px; border-left:5px solid var(--flag-red); border-bottom:1px solid var(--line-blue); cursor:pointer; border-radius:6px; background:rgba(255,255,255,0.72); box-shadow:0 2px 10px rgba(10,49,97,0.08); }
        .event:hover { background:#ffffff; box-shadow:0 4px 16px rgba(10,49,97,0.18); }
        .event-title { display:block; font-weight:bold; color:var(--flag-blue); text-decoration:none; }
        .event-title:hover { text-decoration:underline; }
        .event-meta { font-size:0.9em; margin-top:6px; }
        .official-link { display:inline-block; margin-top:10px; color:var(--white); background:var(--flag-blue); border:1px solid var(--flag-blue); padding:6px 10px; border-radius:4px; text-decoration:none; }
        .official-link:hover { background:var(--flag-red); border-color:var(--flag-red); }
        .summary { font-style:italic; color:#355a84; }
        .source-links { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
        .source-links a { color:var(--flag-blue); border:1px solid var(--flag-blue); border-radius:4px; padding:7px 10px; text-decoration:none; font-size:0.9em; background:var(--white); }
        .source-links a:hover { background:var(--flag-red); border-color:var(--flag-red); color:var(--white); }
        .legend { margin-top:18px; display:grid; gap:8px; font-size:0.9em; }
        .legend-item { display:flex; align-items:center; gap:8px; color:var(--soft-white); }
        .loader { display:none; text-align:center; padding:40px; font-size:1.3em; }
        .drum { font-size:4em; animation: drumbeat 0.8s infinite alternate; }
        @keyframes drumbeat { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(6,27,56,0.92); z-index:1000; align-items:center; justify-content:center; }
        .modal-content { background:#ffffff; border:3px solid var(--flag-red); border-radius:12px; max-width:620px; width:90%; padding:30px; color:var(--flag-blue-dark); box-shadow:0 0 34px rgba(10,49,97,0.4); }
        .modal-close { position:absolute; top:15px; right:20px; font-size:2.2em; cursor:pointer; color:var(--flag-red); }
        .calendar-footer { text-align:center; padding:15px; font-size:0.8em; opacity:0.7; }
        @media (max-width: 900px) {
            .calendar-shell { flex-direction:column; width:calc(100% - 24px); min-height:0; }
            .calendar-panel,
            .events-panel { width:100%; }
            .calendar-panel { border-right:0; border-bottom:4px solid var(--flag-red); }
        }
    </style>
</head>
<body data-page-title="250th Founding Records Calendar" data-site-root="../" data-active-nav="USA250th/index.html">
    <div id="site-header"></div>

    <main class="usa250-page">
    <div class="calendar-shell">
        <div class="calendar-panel">
            <h1>250th Founding Records Calendar</h1>
            <div style="text-align:center;margin:15px 0;font-size:1.1em;">
                <button onclick="prevMonth()" style="background:none;border:none;color:#ffffff;font-size:1.5em;cursor:pointer;">←</button>
                <span id="monthYear" style="font-weight:bold;margin:0 20px;"></span>
                <button onclick="nextMonth()" style="background:none;border:none;color:#ffffff;font-size:1.5em;cursor:pointer;">→</button>
            </div>
            <div class="calendar" id="calendar"></div>
            <div class="legend" id="archive-legend"></div>
        </div>

        <div class="events-panel">
            <div class="source-links">
                <a href="https://founders.archives.gov/" target="_blank" rel="noopener">Founders Online</a>
                <a href="https://www.archives.gov/founding-docs" target="_blank" rel="noopener">Founding Documents</a>
                <a href="https://founders.archives.gov/help/how_to_use" target="_blank" rel="noopener">How to Cite</a>
            </div>
            <input type="text" id="search-box" class="search-box" placeholder="Search Washington, supplies, independence, Congress...">
            <div id="loader" class="loader"><div class="drum">🥁</div><p>Loading month from the Archives...</p></div>
            <div id="event-card" class="event-card" style="display:none;">
                <div id="selected-date" class="date-header"></div>
                <div id="events-list"></div>
            </div>
            <div class="calendar-footer">Metadata calendar • Official records remain on Founders Online and National Archives pages • Link out for full text and citation</div>
        </div>
    </div>
    </main>

    <div id="site-footer"></div>

    <div id="history-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <h2 id="modal-title"></h2>
            <div id="modal-desc"></div>
            <div id="modal-links" style="margin-top:20px;"></div>
        </div>
    </div>

    <script src="../shared/site.js"></script>
    <script>
        const ANNIVERSARY_YEAR = 2026;
        const ORIGINAL_YEAR = ANNIVERSARY_YEAR - 250;
        const MAX_EVENTS_PER_DAY = 25;
        const PROJECT_COLORS = {
            'Washington Papers': '#ffffff',
            'Adams Papers': '#e5233f',
            'Franklin Papers': '#2f6fbe',
            'Jefferson Papers': '#b31942',
            'Jay Papers': '#8fb8ff',
            'Hamilton Papers': '#0a3161',
            'Madison Papers': '#d7e7ff'
        };
        let events1776 = {};
        let loadError = '';

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[char]);
        }

        function anniversaryDate(originalDate) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(originalDate || '')) return null;
            return `${ANNIVERSARY_YEAR}${originalDate.slice(4)}`;
        }

        function formatPeople(label, people) {
            return Array.isArray(people) && people.length
                ? `<div style="font-size:0.9em;margin-top:6px;"><strong>${label}:</strong> ${escapeHtml(people.join(', '))}</div>`
                : '';
        }

        function projectColor(project) {
            return PROJECT_COLORS[project] || '#ffffff';
        }

        function uniqueProjects(dayEvents) {
            return [...new Set(dayEvents.map(ev => ev.project || 'Founders Online'))];
        }

        function renderArchiveDots(dayEl, dayEvents) {
            if (!dayEvents.length) return;

            const dots = document.createElement('div');
            dots.className = 'archive-dots';

            uniqueProjects(dayEvents).slice(0, 5).forEach(project => {
                const dot = document.createElement('span');
                dot.className = 'archive-dot';
                dot.title = project;
                dot.style.background = projectColor(project);
                dots.appendChild(dot);
            });

            dayEl.appendChild(dots);
        }

        function renderLegend() {
            const legend = document.getElementById('archive-legend');
            legend.innerHTML = '';

            Object.entries(PROJECT_COLORS).forEach(([project, color]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<span class="archive-dot" style="background:${color}"></span><span>${escapeHtml(project)}</span>`;
                legend.appendChild(item);
            });
        }

        function normalizeEvent(record) {
            return {
                title: record.title || 'Untitled Founders Online document',
                project: record.project || '',
                authors: record.authors || [],
                recipients: record.recipients || [],
                originalDate: record['date-from'],
                originalDateTo: record['date-to'],
                url: record.permalink
            };
        }

        async function loadEvents() {
            try {
                const resp = await fetch('founders-online-metadata.json');
                if (!resp.ok) throw new Error(`Could not load metadata: ${resp.status}`);

                const metadata = await resp.json();
                events1776 = metadata.reduce((dates, record) => {
                    const sourceDate = record['date-from'];
                    if (!sourceDate || !sourceDate.startsWith(`${ORIGINAL_YEAR}-`)) return dates;

                    const dateKey = anniversaryDate(sourceDate);
                    if (!dateKey) return dates;

                    dates[dateKey] ||= [];
                    dates[dateKey].push(normalizeEvent(record));
                    return dates;
                }, {});

                Object.values(events1776).forEach(dayEvents => {
                    dayEvents.sort((a, b) => a.title.localeCompare(b.title));
                });

                console.log('Loaded', Object.keys(events1776).length, '1776 anniversary dates');
            } catch(e) {
                console.error(e);
                loadError = 'Could not load founders-online-metadata.json. If you opened index.html directly from your computer, the browser will usually block the JSON file. Run this folder through a local web server or publish it to GitHub Pages so the calendar can pull the archive links.';
            }
        }

        let currentDate = new Date(ANNIVERSARY_YEAR, new Date().getMonth(), new Date().getDate());

        async function renderCalendar() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('event-card').style.display = 'none';

            await new Promise(r => setTimeout(r, 600)); // Nice drum animation time

            const cal = document.getElementById('calendar'); cal.innerHTML = '';
            const calendarMonth = new Date(ANNIVERSARY_YEAR, currentDate.getMonth(), 1);
            document.getElementById('monthYear').textContent = calendarMonth.toLocaleString('default', { month: 'long', year: 'numeric' });

            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            days.forEach(d => { const h=document.createElement('div'); h.className='day-header'; h.textContent=d; cal.appendChild(h); });

            const firstDay = calendarMonth.getDay();
            const daysInMonth = new Date(ANNIVERSARY_YEAR, currentDate.getMonth()+1, 0).getDate();

            for (let i=0; i<firstDay; i++) { const e=document.createElement('div'); e.className='day other-month'; cal.appendChild(e); }

            for (let day=1; day<=daysInMonth; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'day';
                dayEl.textContent = day;
                const dateStr = `${ANNIVERSARY_YEAR}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const dayEvents = events1776[dateStr] || [];
                if (dayEvents.length) {
                    dayEl.classList.add('has-event');
                    renderArchiveDots(dayEl, dayEvents);
                }
                if (dateStr === todayKey()) dayEl.classList.add('today');
                dayEl.onclick = () => showDay(dateStr);
                cal.appendChild(dayEl);
            }

            document.getElementById('loader').style.display = 'none';
            document.getElementById('event-card').style.display = 'block';

            if (loadError) {
                document.getElementById('selected-date').textContent = 'Archive metadata not loaded';
                document.getElementById('events-list').innerHTML = `<p class="summary">${escapeHtml(loadError)}</p>`;
                return;
            }

            showDay(defaultDateForCurrentMonth());
        }

        function showDay(dateStr) {
            const dispDate = new Date(`${dateStr}T12:00:00`);
            const originalDateStr = `${ORIGINAL_YEAR}${dateStr.slice(4)}`;
            const originalDate = new Date(`${originalDateStr}T12:00:00`);
            document.getElementById('selected-date').innerHTML = `${dispDate.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'})} <span style="font-size:0.6em;opacity:0.8;">${originalDate.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})}</span>`;

            const list = document.getElementById('events-list');
            list.innerHTML = '';

            const dayEvents = events1776[dateStr] || [];
            if (dayEvents.length === 0) {
                list.innerHTML = `<p class="summary">No Founders Online metadata is dated exactly ${originalDate.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})}.</p>`;
                return;
            }

            const shownEvents = dayEvents.slice(0, MAX_EVENTS_PER_DAY);
            shownEvents.forEach(ev => {
                const div = document.createElement('div');
                div.className = 'event';
                div.innerHTML = `
                    <a class="event-title" href="${escapeHtml(ev.url || '#')}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(ev.title)}</a>
                    <div class="summary"><span class="archive-dot" style="display:inline-block;background:${projectColor(ev.project)}"></span> Official source: ${escapeHtml(ev.project || 'Founders Online')}</div>
                    ${formatPeople('Author', ev.authors)}
                    ${formatPeople('Recipient', ev.recipients)}
                    <div class="event-meta">Original date: ${escapeHtml(ev.originalDate)}</div>
                    ${ev.url ? `<a class="official-link" href="${escapeHtml(ev.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open official record</a>` : ''}
                `;
                if (ev.url) div.onclick = () => window.open(ev.url, '_blank');
                list.appendChild(div);
            });

            if (dayEvents.length > shownEvents.length) {
                const more = document.createElement('p');
                more.className = 'summary';
                more.textContent = `Showing ${shownEvents.length} of ${dayEvents.length} records for this date. Use search terms to narrow the visible list.`;
                list.appendChild(more);
            }

            renderNearbyDates(dateStr);
        }

        function todayKey() {
            const today = new Date();
            return `${ANNIVERSARY_YEAR}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        }

        function defaultDateForCurrentMonth() {
            const monthPrefix = `${ANNIVERSARY_YEAR}-${String(currentDate.getMonth()+1).padStart(2,'0')}-`;
            const today = todayKey();
            if (today.startsWith(monthPrefix)) return today;

            return Object.keys(events1776)
                .filter(dateKey => dateKey.startsWith(monthPrefix))
                .sort()[0] || `${monthPrefix}01`;
        }

        function addDays(dateStr, offset) {
            const date = new Date(`${dateStr}T12:00:00`);
            date.setDate(date.getDate() + offset);
            return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        }

        function renderNearbyDates(selectedDate) {
            const nearby = document.createElement('div');
            nearby.style.marginTop = '24px';
            nearby.innerHTML = '<h3 style="color:#0a3161;">Nearby anniversary dates</h3>';

            for (let offset = -3; offset <= 5; offset++) {
                if (offset === 0) continue;
                const dateKey = addDays(selectedDate, offset);
                const events = events1776[dateKey] || [];
                const date = new Date(`${dateKey}T12:00:00`);
                const row = document.createElement('div');
                row.className = 'event';
                row.innerHTML = `
                    <div class="event-title">${date.toLocaleDateString('en-US', {month:'short', day:'numeric'})}</div>
                    <div class="summary">${events.length ? `${events.length} Founders Online record${events.length === 1 ? '' : 's'}` : 'No exact-date records'}</div>
                    ${events[0] ? `<div style="font-size:0.9em;margin-top:6px;">${escapeHtml(events[0].title)}</div>` : ''}
                `;
                row.onclick = () => showDay(dateKey);
                nearby.appendChild(row);
            }

            document.getElementById('events-list').appendChild(nearby);
        }

        function prevMonth() { currentDate = new Date(ANNIVERSARY_YEAR, currentDate.getMonth()-1, 1); renderCalendar(); }
        function nextMonth() { currentDate = new Date(ANNIVERSARY_YEAR, currentDate.getMonth()+1, 1); renderCalendar(); }

        // Search across loaded month
        document.getElementById('search-box').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.event').forEach(el => {
                el.style.display = el.textContent.toLowerCase().includes(term) ? '' : 'none';
            });
        });

        window.onload = async () => {
            await loadEvents();
            renderLegend();
            renderCalendar();
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
